<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-label="The .edgenn binary: a 44-byte header, then layer records, tensor records and a 16-byte aligned weight blob; a weight tensor's data pointer points straight into the blob, so weights in flash are never copied" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><defs><marker id="edgenn-format-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg, #121a2b)"/></marker><marker id="edgenn-format-arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-1, #0f8fa6)"/></marker></defs><rect x="30" y="50" width="120" height="46" rx="0" fill="var(--fig-2-soft, rgba(196,122,10,0.16))" stroke="var(--fig-2, #c47a0a)" stroke-width="1.2"/><text x="90.0" y="69" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">header</text><text x="90.0" y="85" font-size="8.5" text-anchor="middle" fill="var(--muted, #5b6579)">44 B, magic ENNE</text><rect x="150" y="50" width="150" height="46" rx="0" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="225.0" y="69" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">layer records</text><text x="225.0" y="85" font-size="8.5" text-anchor="middle" fill="var(--muted, #5b6579)">op, in, out, aux</text><rect x="300" y="50" width="180" height="46" rx="0" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="390.0" y="69" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">tensor records</text><text x="390.0" y="85" font-size="8.5" text-anchor="middle" fill="var(--muted, #5b6579)">shape, dtype, data_offset</text><rect x="480" y="50" width="250" height="46" rx="0" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="605.0" y="69" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">weight blob</text><text x="605.0" y="85" font-size="8.5" text-anchor="middle" fill="var(--muted, #5b6579)">16-byte aligned, in flash</text><path d="M360,96 v30 H570 v-28" fill="none" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#edgenn-format-arr-p)"/><text x="465.0" y="140" font-size="10" text-anchor="middle" fill="var(--fig-1, #0f8fa6)">tensor->data = blob + data_offset  (zero copy)</text><text x="30" y="158" font-size="9.5" text-anchor="start" fill="var(--muted, #5b6579)">data_offset = 0xFFFFFFFF marks an activation tensor, which is allocated from the arena</text><text x="30" y="36" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">offset 0</text><text x="730" y="36" font-size="10" text-anchor="end" fill="var(--muted, #5b6579)">end of file</text></svg>