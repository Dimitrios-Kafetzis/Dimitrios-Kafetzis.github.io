<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" role="img" aria-label="CPU0 owns the AI runtime and the NPU; CPU1 reaches inference only through two single-producer single-consumer rings in shared SRAM; the MPU guard protects CPU1's RAM in one direction" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><defs><marker id="syn-dualcore-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg, #121a2b)"/></marker><marker id="syn-dualcore-arr-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg, #121a2b)"/></marker><marker id="syn-dualcore-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-2, #c47a0a)"/></marker></defs><rect x="30" y="30" width="300" height="210" rx="8" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.4"/><text x="45" y="54" font-size="12" text-anchor="start" fill="var(--fg, #121a2b)" font-weight="600">CPU0  Cortex-M33 with FPU, DSP, MPU</text><text x="45" y="72" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">owns the AI runtime</text><rect x="45" y="88" width="270" height="28" rx="4" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1"/><text x="180" y="106" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)">job scheduler</text><rect x="45" y="124" width="270" height="28" rx="4" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1"/><text x="180" y="142" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)">model store + OTA</text><rect x="45" y="160" width="270" height="28" rx="4" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1"/><text x="180" y="178" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)">NPU / DSP HAL</text><rect x="45" y="196" width="270" height="28" rx="4" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1"/><text x="180" y="214" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)">tensor arena</text><rect x="560" y="30" width="170" height="210" rx="8" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.4"/><text x="575" y="54" font-size="12" text-anchor="start" fill="var(--fg, #121a2b)" font-weight="600">CPU1  Cortex-M33</text><text x="575" y="72" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">no FPU, DSP, MPU or TZ</text><rect x="575" y="88" width="140" height="28" rx="4" fill="var(--fig-3-soft, rgba(98,80,214,0.14))" stroke="var(--fig-3, #6250d6)" stroke-width="1"/><text x="645" y="106" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)">application</text><rect x="575" y="124" width="140" height="28" rx="4" fill="var(--fig-3-soft, rgba(98,80,214,0.14))" stroke="var(--fig-3, #6250d6)" stroke-width="1"/><text x="645" y="142" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)">inference client</text><text x="645" y="180" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">64 KB RAM</text><rect x="360" y="60" width="170" height="150" rx="6" fill="var(--surface-2, #eaeef4)" stroke="var(--line, #d8dee8)" stroke-width="1"/><text x="445" y="80" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">shared SRAM</text><line x1="330" y1="112" x2="560" y2="112" stroke="var(--fg, #121a2b)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#syn-dualcore-arr-f)"/><text x="445" y="104" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">request ring (SPSC)</text><line x1="560" y1="150" x2="330" y2="150" stroke="var(--fg, #121a2b)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#syn-dualcore-arr-f)"/><text x="445" y="166" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">response ring (SPSC)</text><rect x="370" y="180" width="150" height="20" rx="3" fill="var(--fig-2-soft, rgba(196,122,10,0.16))" stroke="var(--fig-2, #c47a0a)" stroke-width="1"/><text x="445" y="194" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)">tensor slot, zero copy</text><path d="M180,240 v14 H645 v-14" fill="none" stroke="var(--fig-2, #c47a0a)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#syn-dualcore-arr-g)" stroke-dasharray="4 3"/><text x="412" y="276" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">CPU0 MPU region 7 maps CPU1's RAM read-only; nothing guards the other way</text><text x="445" y="40" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">15 µs typical, 81 µs max round trip</text></svg>