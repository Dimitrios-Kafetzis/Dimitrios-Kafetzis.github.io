<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Before the fix the secure-alias ranges sat on the flash node and only translated its children, so every partition resolved 0x10000000 too high; after it the controller lives under /soc with one ranges entry per child" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><defs><marker id="zephyr-ranges-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg, #121a2b)"/></marker></defs><text x="190" y="24" font-size="12" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">before (4.5 regression)</text><rect x="40" y="40" width="300" height="40" rx="5" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="52" y="57" font-size="11" text-anchor="start" fill="var(--fg, #121a2b)" font-weight="600">flash controller</text><text x="52" y="72" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">no ranges</text><line x1="190" y1="80" x2="190" y2="92" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#zephyr-ranges-arr-a)"/><rect x="40" y="94" width="300" height="40" rx="5" fill="var(--fig-2-soft, rgba(196,122,10,0.16))" stroke="var(--fig-2, #c47a0a)" stroke-width="1.2"/><text x="52" y="111" font-size="11" text-anchor="start" fill="var(--fg, #121a2b)" font-weight="600">flash@0</text><text x="52" y="126" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">ranges = <0x0 0x10000000 ...>  (secure alias)</text><line x1="190" y1="134" x2="190" y2="146" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#zephyr-ranges-arr-a)"/><rect x="40" y="148" width="300" height="40" rx="5" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="52" y="165" font-size="11" text-anchor="start" fill="var(--fg, #121a2b)" font-weight="600">partitions</text><text x="52" y="180" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">reg = <0x0 ...>  children of flash</text><line x1="190" y1="188" x2="190" y2="200" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#zephyr-ranges-arr-a)"/><rect x="40" y="202" width="300" height="40" rx="5" fill="var(--fig-2-soft, rgba(196,122,10,0.16))" stroke="var(--fig-2, #c47a0a)" stroke-width="1.2"/><text x="52" y="219" font-size="11" text-anchor="start" fill="var(--fg, #121a2b)" font-weight="600">slot0_partition</text><text x="52" y="234" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">resolves to 0x1000_0000 + offset</text><text x="190" y="264" font-size="10.5" text-anchor="middle" fill="var(--fig-2, #c47a0a)">MCUboot: "not same sector layout"</text><text x="570" y="24" font-size="12" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">after (#121224)</text><rect x="420" y="40" width="300" height="40" rx="5" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="432" y="57" font-size="11" text-anchor="start" fill="var(--fg, #121a2b)" font-weight="600">/soc/flash-controller</text><text x="432" y="72" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">ranges = one entry per child</text><line x1="570" y1="80" x2="570" y2="92" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#zephyr-ranges-arr-a)"/><rect x="420" y="94" width="300" height="40" rx="5" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="432" y="111" font-size="11" text-anchor="start" fill="var(--fg, #121a2b)" font-weight="600">flash@0</text><text x="432" y="126" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">no ranges needed</text><line x1="570" y1="134" x2="570" y2="146" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#zephyr-ranges-arr-a)"/><rect x="420" y="148" width="300" height="40" rx="5" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="432" y="165" font-size="11" text-anchor="start" fill="var(--fg, #121a2b)" font-weight="600">partitions</text><text x="432" y="180" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">reg = <0x0 ...>  children of flash</text><line x1="570" y1="188" x2="570" y2="200" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#zephyr-ranges-arr-a)"/><rect x="420" y="202" width="300" height="40" rx="5" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="432" y="219" font-size="11" text-anchor="start" fill="var(--fg, #121a2b)" font-weight="600">slot0_partition</text><text x="432" y="234" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">resolves to 0x0000_0000 + offset</text><text x="570" y="264" font-size="10.5" text-anchor="middle" fill="var(--fig-1, #0f8fa6)">generated DT identical on 15 MCXN targets</text><text x="380" y="290" font-size="10.5" text-anchor="middle" fill="var(--muted, #5b6579)">a node's ranges translates only its own children</text></svg>