<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="A preemptible NORMAL job yields at a layer boundary to a REALTIME job with a deadline, then resumes bit-exactly" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><defs><marker id="syn-sched-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg, #121a2b)"/></marker><marker id="syn-sched-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-2, #c47a0a)"/></marker></defs><text x="136" y="87" font-size="12" text-anchor="end" fill="var(--fg, #121a2b)" font-weight="600">REALTIME job</text><line x1="150" y1="98" x2="730" y2="98" stroke="var(--line, #d8dee8)" stroke-width="1" stroke-linecap="round"/><text x="136" y="147" font-size="12" text-anchor="end" fill="var(--fg, #121a2b)" font-weight="600">NORMAL job</text><line x1="150" y1="158" x2="730" y2="158" stroke="var(--line, #d8dee8)" stroke-width="1" stroke-linecap="round"/><line x1="150" y1="190" x2="730" y2="190" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#syn-sched-arr-a)"/><text x="730" y="208" font-size="11" text-anchor="end" fill="var(--muted, #5b6579)">time</text><rect x="150" y="130" width="110" height="26" rx="3" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="205.0" y="147" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)">layer 1</text><rect x="262" y="130" width="110" height="26" rx="3" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="317.0" y="147" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)">layer 2</text><rect x="550" y="130" width="86" height="26" rx="3" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="593.0" y="147" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)">layer 3</text><rect x="638" y="130" width="86" height="26" rx="3" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="681.0" y="147" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)">layer 4</text><rect x="380" y="70" width="182" height="26" rx="3" fill="var(--fig-2-soft, rgba(196,122,10,0.16))" stroke="var(--fig-2, #c47a0a)" stroke-width="1.2"/><text x="471.0" y="87" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)">realtime job, deadline met</text><line x1="380" y1="48" x2="380" y2="66" stroke="var(--fig-2, #c47a0a)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#syn-sched-arr-r)"/><text x="380" y="42" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">submitted</text><line x1="372" y1="143" x2="372" y2="120" stroke="var(--fg, #121a2b)" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="372" y="114" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">layer boundary: park context, 10 µs</text><line x1="550" y1="143" x2="550" y2="120" stroke="var(--fg, #121a2b)" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="550" y="114" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">resume, bit-exact</text><text x="460" y="147" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">suspended</text><text x="150" y="208" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">dispatch: priority, then earliest deadline, then FIFO</text></svg>