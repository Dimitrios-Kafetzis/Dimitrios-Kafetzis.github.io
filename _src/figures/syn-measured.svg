<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="Measured on the FRDM-MCXN947: DMA ingest lands an 8 KB frame in 131 microseconds against 460 for a CPU copy; PowerQuad computes a 256-point FFT in 132 microseconds against 403 in software" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><text x="216" y="44" font-size="12" text-anchor="end" fill="var(--fg, #121a2b)" font-weight="600">8 KB frame ingest</text><path d="M230,52 h428.4 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-428.4 z" fill="var(--fig-1, #0f8fa6)"/><text x="216" y="66" font-size="11" text-anchor="end" fill="var(--muted, #5b6579)">CPU copy</text><text x="670.4" y="66" font-size="11" text-anchor="start" fill="var(--fg, #121a2b)">460 µs</text><path d="M230,80 h119.13999999999999 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-119.13999999999999 z" fill="var(--fig-2, #c47a0a)"/><text x="216" y="94" font-size="11" text-anchor="end" fill="var(--muted, #5b6579)">eDMA</text><text x="361.14" y="94" font-size="11" text-anchor="start" fill="var(--fg, #121a2b)">131 µs</text><text x="216" y="130" font-size="12" text-anchor="end" fill="var(--fg, #121a2b)" font-weight="600">256-point FFT</text><path d="M230,138 h374.82 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-374.82 z" fill="var(--fig-1, #0f8fa6)"/><text x="216" y="152" font-size="11" text-anchor="end" fill="var(--muted, #5b6579)">software, hard FPU</text><text x="616.8199999999999" y="152" font-size="11" text-anchor="start" fill="var(--fg, #121a2b)">403 µs</text><path d="M230,166 h120.08 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-120.08 z" fill="var(--fig-2, #c47a0a)"/><text x="216" y="180" font-size="11" text-anchor="end" fill="var(--muted, #5b6579)">PowerQuad</text><text x="362.08" y="180" font-size="11" text-anchor="start" fill="var(--fg, #121a2b)">132 µs</text><line x1="230" y1="36" x2="230" y2="176" stroke="var(--line, #d8dee8)" stroke-width="1" stroke-linecap="round"/></svg>