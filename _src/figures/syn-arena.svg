<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 204" role="img" aria-label="The SynapticOS tensor arena: persistent weights grow from the base, ephemeral activations after them, scratch at the top; the ephemeral pointer is reset every frame" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><defs><marker id="syn-arena-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg, #121a2b)"/></marker><marker id="syn-arena-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-2, #c47a0a)"/></marker></defs><rect x="40" y="60" width="680" height="54" rx="4" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><rect x="40" y="60" width="250" height="54" fill="var(--fig-1-soft, rgba(15,143,166,0.14))"/><rect x="290" y="60" width="190" height="54" fill="var(--fig-2-soft, rgba(196,122,10,0.16))"/><rect x="600" y="60" width="120" height="54" fill="var(--fig-3-soft, rgba(98,80,214,0.14))"/><line x1="290" y1="60" x2="290" y2="114" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round"/><line x1="480" y1="60" x2="480" y2="114" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="600" y1="60" x2="600" y2="114" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round"/><text x="165.0" y="84" font-size="12" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">persistent</text><text x="165.0" y="100" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">weights, lifetime of the model</text><text x="385.0" y="84" font-size="12" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">ephemeral</text><text x="385.0" y="100" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">activations, one frame</text><text x="540.0" y="91" font-size="11" text-anchor="middle" fill="var(--muted, #5b6579)">free</text><text x="660.0" y="84" font-size="12" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">scratch pool</text><text x="660.0" y="100" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">one layer</text><text x="40" y="32" font-size="11" text-anchor="start" fill="var(--muted, #5b6579)">base</text><line x1="41" y1="42" x2="41" y2="56" stroke="var(--muted, #5b6579)" stroke-width="1" stroke-linecap="round" marker-end="url(#syn-arena-arr-a)"/><text x="290" y="32" font-size="11" text-anchor="middle" fill="var(--muted, #5b6579)">persistent boundary</text><line x1="290" y1="42" x2="290" y2="56" stroke="var(--muted, #5b6579)" stroke-width="1" stroke-linecap="round" marker-end="url(#syn-arena-arr-a)"/><text x="480" y="32" font-size="11" text-anchor="middle" fill="var(--muted, #5b6579)">ephemeral pointer</text><line x1="480" y1="42" x2="480" y2="56" stroke="var(--muted, #5b6579)" stroke-width="1" stroke-linecap="round" marker-end="url(#syn-arena-arr-a)"/><text x="720" y="32" font-size="11" text-anchor="end" fill="var(--muted, #5b6579)">base + total</text><line x1="719" y1="42" x2="719" y2="56" stroke="var(--muted, #5b6579)" stroke-width="1" stroke-linecap="round" marker-end="url(#syn-arena-arr-a)"/><path d="M480,124 v18 H292 v-18" fill="none" stroke="var(--fig-2, #c47a0a)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#syn-arena-arr-r)"/><text x="720" y="164" font-size="10.5" text-anchor="end" fill="var(--muted, #5b6579)">syn_mem_reset_ephemeral() every frame: O(1), peak returns to zero</text><text x="40" y="184" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">16-byte aligned, ~154 cycles per allocation, zero fragmentation by construction</text></svg>