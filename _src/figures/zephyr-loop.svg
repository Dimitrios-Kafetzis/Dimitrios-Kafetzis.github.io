<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206" role="img" aria-label="The contribution loop: scout an unclaimed issue, write a root-cause note, claim it on the issue, fix and build a test matrix, open the PR with a Testing and Not-tested section, answer reviews by rebasing, then merge" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><defs><marker id="zephyr-loop-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg, #121a2b)"/></marker><marker id="zephyr-loop-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-2, #c47a0a)"/></marker></defs><rect x="19" y="60" width="98" height="52" rx="6" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="68.0" y="82" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">scout</text><text x="68.0" y="100" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">unclaimed, repro</text><line x1="117" y1="86" x2="122" y2="86" stroke="var(--fg, #121a2b)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#zephyr-loop-arr-a)"/><rect x="123" y="60" width="98" height="52" rx="6" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="172.0" y="82" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">root-cause note</text><text x="172.0" y="100" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">verified / inferred</text><line x1="221" y1="86" x2="226" y2="86" stroke="var(--fg, #121a2b)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#zephyr-loop-arr-a)"/><rect x="227" y="60" width="98" height="52" rx="6" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="276.0" y="82" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">claim on issue</text><text x="276.0" y="100" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">cause + repro</text><line x1="325" y1="86" x2="330" y2="86" stroke="var(--fg, #121a2b)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#zephyr-loop-arr-a)"/><rect x="331" y="60" width="98" height="52" rx="6" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="380.0" y="82" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">fix + tests</text><text x="380.0" y="100" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">sim, QEMU, board</text><line x1="429" y1="86" x2="434" y2="86" stroke="var(--fg, #121a2b)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#zephyr-loop-arr-a)"/><rect x="435" y="60" width="98" height="52" rx="6" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="484.0" y="82" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">pull request</text><text x="484.0" y="100" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">Testing, Not tested</text><line x1="533" y1="86" x2="538" y2="86" stroke="var(--fg, #121a2b)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#zephyr-loop-arr-a)"/><rect x="539" y="60" width="98" height="52" rx="6" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="588.0" y="82" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">review</text><text x="588.0" y="100" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">rebase, force-push</text><line x1="637" y1="86" x2="642" y2="86" stroke="var(--fg, #121a2b)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#zephyr-loop-arr-a)"/><rect x="643" y="60" width="98" height="52" rx="6" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="692.0" y="91" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">merged</text><path d="M589.0,112 v24 H381.0 v-18" fill="none" stroke="var(--fig-2, #c47a0a)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#zephyr-loop-arr-r)"/><text x="485.0" y="152" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">changes requested: smaller fix, shorter commit message</text><text x="380" y="176" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">one nudge after seven days of silence, then stop</text><text x="380" y="194" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">4 Oct to 18 Oct 2026: 10 PRs opened, 5 merged, 24 lines added by the merged ones</text></svg>