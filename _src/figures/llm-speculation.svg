<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="Inter-layer speculation: once layer l has its intermediate output Z, the next layer's attention starts on Z while the FFN finishes; the result is kept if the FFN contribution is small, otherwise attention is re-run on the exact input" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><defs><marker id="llm-speculation-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg, #121a2b)"/></marker><marker id="llm-speculation-arr-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-1, #0f8fa6)"/></marker></defs><text x="136" y="78" font-size="12" text-anchor="end" fill="var(--fg, #121a2b)" font-weight="600">layer l</text><line x1="150" y1="90" x2="730" y2="90" stroke="var(--line, #d8dee8)" stroke-width="1" stroke-linecap="round"/><text x="136" y="148" font-size="12" text-anchor="end" fill="var(--fg, #121a2b)" font-weight="600">layer l+1</text><line x1="150" y1="160" x2="730" y2="160" stroke="var(--line, #d8dee8)" stroke-width="1" stroke-linecap="round"/><rect x="150" y="62" width="120" height="26" rx="3" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="210.0" y="79" font-size="10.5" text-anchor="middle" fill="var(--fg, #121a2b)">attention</text><rect x="272" y="62" width="70" height="26" rx="3" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="307.0" y="79" font-size="10.5" text-anchor="middle" fill="var(--fg, #121a2b)">projection</text><rect x="344" y="62" width="190" height="26" rx="3" fill="var(--fig-2-soft, rgba(196,122,10,0.16))" stroke="var(--fig-2, #c47a0a)" stroke-width="1.2"/><text x="439.0" y="79" font-size="10.5" text-anchor="middle" fill="var(--fg, #121a2b)">FFN(Z) on device A</text><line x1="342" y1="46" x2="342" y2="62" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round"/><text x="342" y="40" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">Z = X_prev + proj(A) available</text><path d="M342,90 v18 h12" fill="none" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#llm-speculation-arr-z)"/><rect x="356" y="132" width="186" height="26" rx="3" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2" stroke-dasharray="4 3"/><text x="449.0" y="149" font-size="10.5" text-anchor="middle" fill="var(--fg, #121a2b)">attention on Z (speculative)</text><rect x="544" y="132" width="70" height="26" rx="3" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2" stroke-dasharray="4 3"/><text x="579.0" y="149" font-size="10.5" text-anchor="middle" fill="var(--fg, #121a2b)">projection</text><line x1="534" y1="62" x2="534" y2="58" stroke="var(--fg, #121a2b)" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="542" y="22" font-size="10" text-anchor="start" fill="var(--fg, #121a2b)">FFN done: ||FFN(Z)||/||Z|| < 0.05 ?</text><text x="542" y="36" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">yes: keep (84% of transitions)</text><text x="542" y="50" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">no: re-run attention on exact X</text><path d="M356,170 v8 H534 v-8" fill="none" stroke="var(--muted, #5b6579)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="445.0" y="194" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">overlap hides 70 to 85% of the FFN time</text><line x1="150" y1="215" x2="730" y2="215" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#llm-speculation-arr-a)"/><text x="730" y="232" font-size="10" text-anchor="end" fill="var(--muted, #5b6579)">time within one token</text></svg>