<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="One controller holds embeddings, the LM head, placement and the token loop; four workers hold attention heads, projections and FFN blocks and exchange activations over PyTorch RPC on WiFi" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><defs><marker id="llm-system-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg, #121a2b)"/></marker><marker id="llm-system-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-1, #0f8fa6)"/></marker></defs><rect x="270" y="20" width="220" height="60" rx="8" fill="var(--fig-2-soft, rgba(196,122,10,0.16))" stroke="var(--fig-2, #c47a0a)" stroke-width="1.3"/><text x="380" y="42" font-size="12" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">controller (Raspberry Pi 4)</text><text x="380" y="60" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">embeddings, LM head, placement,</text><text x="380" y="72" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">speculation decisions, token loop</text><rect x="40" y="140" width="140" height="60" rx="8" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.3"/><text x="110" y="160" font-size="12" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">worker 1</text><text x="110" y="177" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">heads, projection, FFN</text><text x="110" y="190" font-size="9.5" text-anchor="middle" fill="var(--muted, #5b6579)">4 GB, Cortex-A72</text><line x1="380" y1="80" x2="110" y2="140" stroke="var(--fg, #121a2b)" stroke-width="1" stroke-linecap="round" marker-end="url(#llm-system-arr-a)"/><rect x="220" y="140" width="140" height="60" rx="8" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.3"/><text x="290" y="160" font-size="12" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">worker 2</text><text x="290" y="177" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">heads, projection, FFN</text><text x="290" y="190" font-size="9.5" text-anchor="middle" fill="var(--muted, #5b6579)">4 GB, Cortex-A72</text><line x1="380" y1="80" x2="290" y2="140" stroke="var(--fg, #121a2b)" stroke-width="1" stroke-linecap="round" marker-end="url(#llm-system-arr-a)"/><rect x="400" y="140" width="140" height="60" rx="8" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.3"/><text x="470" y="160" font-size="12" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">worker 3</text><text x="470" y="177" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">heads, projection, FFN</text><text x="470" y="190" font-size="9.5" text-anchor="middle" fill="var(--muted, #5b6579)">4 GB, Cortex-A72</text><line x1="380" y1="80" x2="470" y2="140" stroke="var(--fg, #121a2b)" stroke-width="1" stroke-linecap="round" marker-end="url(#llm-system-arr-a)"/><rect x="580" y="140" width="140" height="60" rx="8" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.3"/><text x="650" y="160" font-size="12" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">worker 4</text><text x="650" y="177" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">heads, projection, FFN</text><text x="650" y="190" font-size="9.5" text-anchor="middle" fill="var(--muted, #5b6579)">4 GB, Cortex-A72</text><line x1="380" y1="80" x2="650" y2="140" stroke="var(--fg, #121a2b)" stroke-width="1" stroke-linecap="round" marker-end="url(#llm-system-arr-a)"/><rect x="200" y="106" width="360" height="18" rx="4" fill="var(--surface, #ffffff)"/><text x="380" y="119" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">PyTorch RPC over 802.11ac, 8 to 12 ms RTT, retries for jitter</text><path d="M180,215 H580" fill="none" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#llm-system-arr-g)" stroke-dasharray="4 3"/><text x="380" y="226" font-size="9.5" text-anchor="middle" fill="var(--muted, #5b6579)">head outputs gathered at the projection device, result broadcast to the next layer's devices</text></svg>