<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="One partitioned inference request: the device runs stages 1 to s locally, transmits the cut tensor over the wireless link, waits in the edge server's queue behind other devices' requests under round-robin or shortest-job-first, and the server runs stages s+1 to S; the testbed records each phase separately" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><defs><marker id="testbed-phases-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg, #121a2b)"/></marker></defs><text x="126" y="78" font-size="12" text-anchor="end" fill="var(--fg, #121a2b)" font-weight="600">device i</text><line x1="140" y1="90" x2="720" y2="90" stroke="var(--line, #d8dee8)" stroke-width="1" stroke-linecap="round"/><text x="126" y="130" font-size="12" text-anchor="end" fill="var(--fg, #121a2b)" font-weight="600">wireless link</text><line x1="140" y1="142" x2="720" y2="142" stroke="var(--line, #d8dee8)" stroke-width="1" stroke-linecap="round"/><text x="126" y="182" font-size="12" text-anchor="end" fill="var(--fg, #121a2b)" font-weight="600">edge server</text><line x1="140" y1="194" x2="720" y2="194" stroke="var(--line, #d8dee8)" stroke-width="1" stroke-linecap="round"/><rect x="140" y="62" width="160" height="26" rx="3" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="220.0" y="74" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">local_ns</text><text x="220.0" y="85" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">stages 1 .. s on the device</text><rect x="302" y="114" width="160" height="26" rx="3" fill="var(--fig-3-soft, rgba(98,80,214,0.14))" stroke="var(--fig-3, #6250d6)" stroke-width="1.2"/><text x="382.0" y="126" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">transmission_ns</text><text x="382.0" y="137" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">cut tensor, first byte to ack</text><rect x="464" y="166" width="120" height="26" rx="3" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-dasharray="4 3"/><text x="524.0" y="178" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">queue_wait_ns</text><text x="524.0" y="189" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">behind other devices</text><rect x="586" y="166" width="130" height="26" rx="3" fill="var(--fig-2-soft, rgba(196,122,10,0.16))" stroke="var(--fig-2, #c47a0a)" stroke-width="1.2"/><text x="651.0" y="178" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">remote_ns</text><text x="651.0" y="189" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">stages s+1 .. S, RR or SJF</text><rect x="718" y="114" width="52" height="26" rx="3" fill="var(--fig-3-soft, rgba(98,80,214,0.14))" stroke="var(--fig-3, #6250d6)" stroke-width="1.2"/><text x="744.0" y="131" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">result</text><line x1="300" y1="88" x2="302" y2="112" stroke="var(--fg, #121a2b)" stroke-width="1" stroke-linecap="round" marker-end="url(#testbed-phases-arr-a)"/><line x1="462" y1="140" x2="464" y2="164" stroke="var(--fg, #121a2b)" stroke-width="1" stroke-linecap="round" marker-end="url(#testbed-phases-arr-a)"/><line x1="716" y1="166" x2="720" y2="140" stroke="var(--fg, #121a2b)" stroke-width="1" stroke-linecap="round" marker-end="url(#testbed-phases-arr-a)"/><path d="M140,212 v6 H770 v-6" fill="none" stroke="var(--muted, #5b6579)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="232" font-size="9.5" text-anchor="middle" fill="var(--muted, #5b6579)">end-to-end delay per request; every phase is an integer in nanoseconds from perf_counter_ns</text><text x="140" y="44" font-size="9.5" text-anchor="start" fill="var(--muted, #5b6579)">partition point s: the layer after which computation moves to the server; s = S keeps everything local</text></svg>