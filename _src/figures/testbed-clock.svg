" r="5" fill="var(--fig-2, #c47a0a)" stroke="var(--surface, #ffffff)" stroke-width="2"/><circle cx="510" cy="154" r="4" fill="var(--fig-1, #0f8fa6)" stroke="var(--surface, #ffffff)" stroke-width="2"/><line x1="330" y1="30" x2="330" y2="172" stroke="var(--fig-2, #c47a0a)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/><text x="330" y="22" font-size="10" text-anchor="middle" fill="var(--fig-2, #c47a0a)">T0: start signal, 3 s ahead</text><text x="510" y="184" font-size="9.5" text-anchor="middle" fill="var(--fig-1, #0f8fa6)">sample</text><text x="150" y="206" font-size="10" text-anchor="start" fill="var(--fg, #121a2b)">wall = origin.wall_time_s + (sample.perf_counter_ns - origin.perf_counter_ns) / 1e9</text><text x="150" y="222" font-size="9.5" text-anchor="start" fill="var(--muted, #5b6579)">preflight refuses to start if any device's NTP offset exceeds 1 ms (chrony on the edge server)</text></svg>