<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" role="img" aria-label="Share of per-layer time: layer-wise spends 55 percent in attention and 35 in the FFN; after head-level partitioning attention falls to 24 percent and the FFN rises to 48" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><text x="136" y="45" font-size="12" text-anchor="end" fill="var(--fg, #121a2b)" font-weight="600">layer-wise</text><rect x="150" y="30" width="306.0" height="22" fill="var(--fig-1, #0f8fa6)"/><text x="303.0" y="45" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="600">attention 55%</text><rect x="458.0" y="30" width="194.0" height="22" fill="var(--fig-2, #c47a0a)"/><text x="555.0" y="45" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="600">FFN 35%</text><rect x="654.0" y="30" width="54.0" height="22" fill="var(--line, #d8dee8)"/><text x="136" y="83" font-size="12" text-anchor="end" fill="var(--fg, #121a2b)" font-weight="600">head-level</text><rect x="150" y="68" width="132.4" height="22" fill="var(--fig-1, #0f8fa6)"/><text x="216.2" y="83" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="600">attention 24%</text><rect x="284.4" y="68" width="266.8" height="22" fill="var(--fig-2, #c47a0a)"/><text x="417.79999999999995" y="83" font-size="10.5" text-anchor="middle" fill="#ffffff" font-weight="600">FFN 48%</text><rect x="553.2" y="68" width="154.8" height="22" fill="var(--line, #d8dee8)"/><rect x="150" y="120" width="14" height="12" rx="2" fill="var(--fig-1, #0f8fa6)"/><text x="170" y="130" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">attention</text><rect x="340" y="120" width="14" height="12" rx="2" fill="var(--fig-2, #c47a0a)"/><text x="360" y="130" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">feed-forward network</text><rect x="530" y="120" width="14" height="12" rx="2" fill="var(--line, #d8dee8)"/><text x="550" y="130" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">communication and other</text><text x="150" y="156" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">parallelising attention moved the bottleneck to the FFN, which speculation then overlaps</text></svg>