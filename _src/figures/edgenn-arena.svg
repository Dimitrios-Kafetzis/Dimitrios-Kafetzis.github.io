<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="EdgeNN's scratch arena usage over five layers: each operator saves the offset, allocates, computes and restores, so usage returns to the activation baseline after every layer and the peak is the single most expensive layer, not the sum" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><defs><marker id="edgenn-arena-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg, #121a2b)"/></marker></defs><line x1="90" y1="180" x2="720" y2="180" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#edgenn-arena-arr-a)"/><line x1="90" y1="180" x2="90" y2="30" stroke="var(--fg, #121a2b)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#edgenn-arena-arr-a)"/><text x="720" y="198" font-size="10" text-anchor="end" fill="var(--muted, #5b6579)">layers</text><text x="82" y="34" font-size="10" text-anchor="end" fill="var(--muted, #5b6579)">scratch</text><text x="82" y="46" font-size="10" text-anchor="end" fill="var(--muted, #5b6579)">offset</text><text x="149.0" y="196" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">layer 1</text><text x="267.0" y="196" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">layer 2</text><text x="385.0" y="196" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">layer 3</text><text x="503.0" y="196" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">layer 4</text><text x="621.0" y="196" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">layer 5</text><path d="M90,150 H96.0 V110 H202.0 V150 H214.0 V70 H320.0 V150 H332.0 V125 H438.0 V150 H450.0 V95 H556.0 V150 H568.0 V60 H674.0 V150 H90 z" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="none"/><path d="M90,150 H96.0 V110 H202.0 V150 H214.0 V70 H320.0 V150 H332.0 V125 H438.0 V150 H450.0 V95 H556.0 V150 H568.0 V60 H674.0 V150" fill="none" stroke="var(--fig-1, #0f8fa6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="90" y1="60" x2="700" y2="60" stroke="var(--fig-2, #c47a0a)" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/><text x="98" y="53" font-size="10" text-anchor="start" fill="var(--fig-2, #c47a0a)">edgenn_arena_peak(): the SRAM to reserve</text><text x="385.0" y="170" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">each layer: save, alloc, compute, restore</text><line x1="90" y1="150" x2="700" y2="150" stroke="var(--muted, #5b6579)" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><text x="700" y="144" font-size="9.5" text-anchor="end" fill="var(--muted, #5b6579)">activation tensors</text><text x="90" y="212" font-size="10" text-anchor="start" fill="var(--muted, #5b6579)">weight arena: filled once at load, never freed, zero-copy from flash</text></svg>