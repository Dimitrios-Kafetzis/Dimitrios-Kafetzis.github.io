<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="The testbed has two networks: an isolated 802.11ac data plane between the edge server's access point and the five boards, and a wired management plane through a switch for SSH, result collection, NTP and package installation" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><defs><marker id="testbed-topology-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg, #121a2b)"/></marker></defs><rect x="30" y="70" width="210" height="150" rx="8" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.4"/><text x="135" y="94" font-size="12" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">edge server</text><text x="135" y="110" font-size="9.5" text-anchor="middle" fill="var(--muted, #5b6579)">i7-9700K, 32 GB, Ubuntu 22.04</text><rect x="45" y="122" width="180" height="24" rx="4" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1"/><text x="135" y="138" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)">NNPM + orchestration</text><rect x="45" y="152" width="180" height="24" rx="4" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1"/><text x="135" y="168" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)">access point 802.11ac</text><rect x="45" y="182" width="180" height="24" rx="4" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1"/><text x="135" y="198" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)">NTP server, package mirror</text><rect x="330" y="250" width="110" height="34" rx="6" fill="var(--surface-2, #eaeef4)" stroke="var(--line, #d8dee8)" stroke-width="1"/><text x="385" y="271" font-size="10" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">Ethernet switch</text