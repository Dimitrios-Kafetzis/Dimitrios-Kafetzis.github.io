<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-label="The INT8 path: int8 inputs and per-channel int8 weights multiply into an int32 accumulator with an int32 bias, then a fixed-point multiplier and shift computed at load time requantise to int8, saturate, and a 256-entry lookup table applies the activation; no float anywhere on this path" font-family="'IBM Plex Mono', Menlo, Consolas, monospace"><defs><marker id="edgenn-int8-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg, #121a2b)"/></marker><marker id="edgenn-int8-arr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-2, #c47a0a)"/></marker></defs><rect x="19" y="70" width="96" height="52" rx="6" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="67.0" y="92" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">int8 x</text><text x="67.0" y="110" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">per-tensor scale</text><line x1="115" y1="96" x2="122" y2="96" stroke="var(--fg, #121a2b)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#edgenn-int8-arr-a)"/><rect x="123" y="70" width="96" height="52" rx="6" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="171.0" y="92" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">int8 w</text><text x="171.0" y="110" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">per-channel scale</text><line x1="219" y1="96" x2="226" y2="96" stroke="var(--fg, #121a2b)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#edgenn-int8-arr-a)"/><rect x="227" y="70" width="96" height="52" rx="6" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="275.0" y="92" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">int32 acc</text><text x="275.0" y="110" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">MAC + int32 bias</text><line x1="323" y1="96" x2="330" y2="96" stroke="var(--fg, #121a2b)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#edgenn-int8-arr-a)"/><rect x="331" y="70" width="96" height="52" rx="6" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="379.0" y="92" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">requantise</text><text x="379.0" y="110" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">(acc * M) >> shift</text><line x1="427" y1="96" x2="434" y2="96" stroke="var(--fg, #121a2b)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#edgenn-int8-arr-a)"/><rect x="435" y="70" width="96" height="52" rx="6" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="483.0" y="92" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">saturate</text><text x="483.0" y="110" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">[-128, 127]</text><line x1="531" y1="96" x2="538" y2="96" stroke="var(--fg, #121a2b)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#edgenn-int8-arr-a)"/><rect x="539" y="70" width="96" height="52" rx="6" fill="var(--fig-1-soft, rgba(15,143,166,0.14))" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2"/><text x="587.0" y="92" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">LUT</text><text x="587.0" y="110" font-size="8" text-anchor="middle" fill="var(--muted, #5b6579)">256-entry table</text><line x1="635" y1="96" x2="642" y2="96" stroke="var(--fg, #121a2b)" stroke-width="1.3" stroke-linecap="round" marker-end="url(#edgenn-int8-arr-a)"/><rect x="643" y="70" width="96" height="52" rx="6" fill="var(--surface, #ffffff)" stroke="var(--fg, #121a2b)" stroke-width="1.2"/><text x="691.0" y="101" font-size="11" text-anchor="middle" fill="var(--fg, #121a2b)" font-weight="600">int8 y</text><path d="M228,134 v8 H636 v-8" fill="none" stroke="var(--fig-1, #0f8fa6)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="432.0" y="158" font-size="10" text-anchor="middle" fill="var(--fig-1, #0f8fa6)">runtime: integer only, SMMUL + shift on Cortex-M7</text><text x="380.0" y="24" font-size="10" text-anchor="middle" fill="var(--fig-2, #c47a0a)">load time (floats allowed once)</text><text x="380.0" y="38" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">M, shift = frexpf(S_in * S_w / S_out)</text><line x1="380.0" y1="44" x2="380.0" y2="66" stroke="var(--fig-2, #c47a0a)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#edgenn-int8-arr-l)"/><text x="588.0" y="38" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">table = f(scale, zero point)</text><line x1="588.0" y1="44" x2="588.0" y2="66" stroke="var(--fig-2, #c47a0a)" stroke-width="1.2" stroke-linecap="round" marker-end="url(#edgenn-int8-arr-l)"/><text x="380" y="190" font-size="10" text-anchor="middle" fill="var(--muted, #5b6579)">symmetric weights (zero point 0) remove one subtraction per multiply-accumulate</text></svg>